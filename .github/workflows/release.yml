# Do not edit by hand — regenerate with `cargo dist init` / `cargo dist generate-ci`
# cargo-dist-version = 0.32.0

name: Release

permissions:
  contents: write

# Trigger on version tags like v0.1.0, v1.2.3, etc.
# Also supports dispatch_releases via workflow_dispatch if needed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0) — leave empty for dry-run plan"
        required: false
        type: string

jobs:
  # Run `cargo dist plan` to determine what to build/publish
  plan:
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.plan.outputs.tag }}
      tag-flag: ${{ steps.plan.outputs.tag-flag }}
      publishing: ${{ steps.plan.outputs.publishing }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Cache cargo-dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        run: |
          dist ${{ github.event.inputs.tag && format('host --steps=create --tag={0}', github.event.inputs.tag) || format('host --steps=create --tag={0}', github.ref_name) }} --output-format=json > plan-dist-manifest.json || dist plan --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag-flag=--tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" || -n "${{ github.event.inputs.tag }}" ]]; then
            echo "publishing=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build all platform-specific artifacts (archives, symbols)
  # This is the standard cargo-dist `build` job — matrix is computed by `dist plan`
  build:
    name: build (${{ join(matrix.targets, ', ') }})
    needs: [plan]
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable Windows longpaths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust (if container)
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ join(matrix.targets, '-') }}
          cache-provider: ${{ matrix.cache_provider }}
      - name: Install cargo-dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      # Explicit SDL2 system dependencies (mirrors ci.yml and ensures linking succeeds
      # even if matrix.packages_install is stale). Keeps the exact commands from the
      # task spec so reviewers can verify at a glance.
      - name: Install SDL2 dependencies (Linux)
        if: matrix.runner == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev pkg-config
      - name: Install SDL2 dependencies (macOS)
        if: contains(matrix.runner, 'macos')
        run: brew install sdl2 sdl2_ttf || brew upgrade sdl2 sdl2_ttf || true
      - name: Ensure cmake for Windows bundled build
        if: matrix.runner == 'windows-2022'
        run: cmake --version || choco install cmake --yes
        shell: pwsh
      # sdl2-sys `bundled` only vendors SDL2 core, not SDL_ttf. The `sdl2` crate with
      # `features = ["ttf"]` still needs SDL2_ttf.lib at link time. Provide it via
      # prebuilt VC develop libs and expose to rustc via LIB/RUSTFLAGS.
      - name: Install SDL2_ttf for Windows (bundled SDL2 + external SDL_ttf)
        if: matrix.runner == 'windows-2022'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-devel-2.22.0-VC.zip"
          $zip = "$env:RUNNER_TEMP\SDL2_ttf.zip"
          Write-Host "Downloading SDL2_ttf from $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          } catch {
            # Fallback to libsdl.org mirror
            $url2 = "https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-devel-2.22.0-VC.zip"
            Write-Host "Fallback to $url2"
            Invoke-WebRequest -Uri $url2 -OutFile $zip -UseBasicParsing
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $ttfDir = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter "SDL2_ttf*" | Select-Object -First 1
          if (-not $ttfDir) { throw "Failed to locate SDL2_ttf dir in $env:RUNNER_TEMP" }
          $libDir = Join-Path $ttfDir.FullName "lib\x64"
          Write-Host "SDL2_ttf libDir: $libDir"
          Get-ChildItem $libDir | Format-Table Name, Length
          $existingLib = $env:LIB
          $newLib = "$libDir;$existingLib"
          "LIB=$newLib" | Out-File -FilePath $env:GITHUB_ENV -Append
          $existingFlags = $env:RUSTFLAGS
          $newFlags = if ($existingFlags) { "$existingFlags -L $libDir" } else { "-L $libDir" }
          "RUSTFLAGS=$newFlags" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Set LIB and RUSTFLAGS for SDL2_ttf"
          # Copy DLLs to Windows System32 for runtime (best effort)
          $dll = Join-Path $libDir "SDL2_ttf.dll"
          if (Test-Path $dll) {
            Copy-Item $dll -Destination "$env:RUNNER_TEMP\SDL2_ttf.dll" -Force
            try { Copy-Item $dll -Destination "C:\Windows\System32\SDL2_ttf.dll" -Force -ErrorAction SilentlyContinue } catch {}
          }
      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist build ran successfully"
          cat dist-manifest.json
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build global artifacts (shell/powershell/homebrew installers, checksums)
  host:
    needs:
      - plan
      - build
    # publish only when not a pure plan run
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build.result == 'skipped' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached cargo-dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist || true
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

  # Publish to package managers (e.g. Homebrew tap)
  # Homebrew formula is published via the axo `publish-homebrew-formula` flow;
  # this job mirrors the standard cargo-dist `publish` / `announce` stage.
  publish:
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached cargo-dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist || true
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Publish Homebrew formula and announce
        shell: bash
        run: |
          # Announce creates/updates the GitHub Release and publishes Homebrew tap.
          # For prereleases this step is skipped unless publish_prereleases = true.
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=publish --output-format=json > dist-manifest.json || true
          dist announce ${{ needs.plan.outputs.tag-flag }} --output-format=json > announce-manifest.json || cat dist-manifest.json > announce-manifest.json
          cat announce-manifest.json
