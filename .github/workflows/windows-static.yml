# Standalone static MSVC Windows build — produces a second artifact with no DLLs.
#
# Why a separate workflow instead of patching release.yml:
# release.yml is autogenerated by `cargo dist generate` (header "DO NOT EDIT").
# Any manual Windows-static job added there would be overwritten on next
# `cargo dist generate`. A dedicated file is stable and cheaper to review.
#
# What it does:
# - runs on windows-2022 (same as the dynamic dist job) but does NOT download
#   SDL2-devel-*-VC.zip / SDL2_ttf-devel-*-VC.zip. Instead it builds SDL2 core
#   statically via sdl2-sys `bundled` + `static-link` (cmake SDL_SHARED=OFF,
#   SDL_STATIC=ON) and requests CRT static via RUSTFLAGS="-C target-feature=+crt-static".
# - SDL2_ttf static limitation (upstream): sdl2-sys build.rs when
#   `bundled && static-link` deliberately skips linking SDL2_ttf / SDL2_image /
#   SDL2_mixer (see comment in build.rs around `if !cfg!(feature = "bundled")`).
#   So `cargo build --features static` alone would leave TTF symbols unresolved.
#   Workaround tried here:
#   1) Install SDL2 + SDL2_ttf + freetype + harfbuzz as STATIC libs via vcpkg
#      triplet `x64-windows-static` (CRT static) which matches +crt-static.
#      If that triplet is unavailable on the runner image, fallback to
#      `x64-windows-static-md` (static libs, dynamic CRT) — still eliminates DLLs
#      at runtime, just uses dynamic CRT.
#   2) Append RUSTFLAGS `-L <vcpkg_installed>/lib -l static=SDL2_ttf -l static=freetype ...`
#      so the final link pulls TTF in statically. Additional libs (bzip2, png,
#      zlib, brotli, graphite2) are added best-effort; missing ones are ignored by MSVC
#      unless actually referenced.
#   3) If vcpkg is unavailable or static TTF still fails, the workflow falls back
#      to documenting the limitation and keeps SDL2 core static + CRT static while
#      leaving SDL2_ttf dynamic (still one DLL). The artifact is always produced.
#
# Triggering: same as release.yml — version tags `**[0-9]+.[0-9]+.[0-9]+*`,
# manual `workflow_dispatch`, and PRs (for validation, upload is skipped on PRs
# unless pr_run_mode would publish).
#
# Artifact: `play-crt-x86_64-pc-windows-msvc-static.zip` containing
# `play-crt.exe` (and assets if present). Distinct name from the dynamic dist
# artifact (`play-crt-x86_64-pc-windows-msvc.zip`).

name: Windows Static (MSVC)

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build-windows-static:
    name: build windows static (x86_64-pc-windows-msvc, +crt-static)
    runs-on: windows-2022
    env:
      # CRT static — produces a fully self-contained exe (no VCRedist).
      # Appended to by later steps for TTF static libs.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false

      - name: Ensure cmake for bundled SDL2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          if ($LASTEXITCODE -ne 0) { choco install cmake --yes; cmake --version }

      # ------------------------------------------------------------------
      # Static SDL2_ttf workaround via vcpkg
      # Installs SDL2 + SDL2_ttf + dependencies as static libs.
      # The runner image (windows-2022) ships vcpkg at C:\vcpkg or $VCPKG_INSTALLATION_ROOT.
      # Both triplets are tried; first success wins.
      # ------------------------------------------------------------------
      - name: Install SDL2 / SDL2_ttf static libs via vcpkg (best-effort)
        id: vcpkg
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          # Resolve vcpkg root
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          Write-Host "VCPKG root: $vcpkgRoot"
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            Write-Warning "vcpkg.exe not found at $vcpkg — skipping static TTF workaround"
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          & $vcpkg version
          # Prefer CRT-static triplet; fallback to static-md if not available
          $triplets = @("x64-windows-static", "x64-windows-static-md")
          $installedTriplet = $null
          foreach ($tri in $triplets) {
            Write-Host "`n=== Trying vcpkg install sdl2 sdl2-ttf freetype harfbuzz:$tri ==="
            & $vcpkg install sdl2:$tri sdl2-ttf:$tri freetype:$tri harfbuzz:$tri --recurse 2>&1 | Tee-Object -Variable out
            if ($LASTEXITCODE -eq 0) {
              Write-Host "vcpkg install succeeded with triplet $tri"
              $installedTriplet = $tri
              break
            } else {
              Write-Warning "vcpkg install failed for $tri, trying next"
            }
          }
          # Also ensure libpng+zlib+bzip2+brotli which freetype/harfbuzz may need
          if ($installedTriplet) {
            Write-Host "Installing auxiliary static deps for $installedTriplet (best-effort)"
            & $vcpkg install libpng:$installedTriplet zlib:$installedTriplet bzip2:$installedTriplet brotli:$installedTriplet graphite2:$installedTriplet 2>&1 | Out-Null
          }
          if ($installedTriplet) {
            $installed = Join-Path $vcpkgRoot "installed\$installedTriplet"
            $libDir = Join-Path $installed "lib"
            $includeDir = Join-Path $installed "include"
            Write-Host "vcpkg installed dir: $installed"
            Write-Host "libDir: $libDir"
            if (Test-Path $libDir) { Get-ChildItem $libDir -Filter "*.lib" | Select-Object Name, Length | Format-Table -AutoSize }
            # Export for next steps
            "triplet=$installedTriplet" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "libdir=$libDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "installed=$installed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            # Also set VCPKG envs for any downstream crate that probes vcpkg
            "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VCPKG_DEFAULT_TRIPLET=$installedTriplet" | Out-File -FilePath $env:GITHUB_ENV -Append
            # SDL2_ttf static freetype/harfbuzz libs the linker will need — appended to RUSTFLAGS
            # MSVC link libs are order-insensitive but we list likely required ones.
            $extraLibs = @(
              "SDL2_ttf", "freetype", "harfbuzz", "graphite2",
              "libpng16", "zlib", "bz2", "brotlicommon", "brotlidec"
            )
            $libFlags = ($extraLibs | ForEach-Object { "-l static=$_" }) -join " "
            $rustflagsAdd = "-L $libDir $libFlags"
            # Add Windows system libs already emitted by sdl2-sys static path,
            # plus extra freetype deps if needed (best-effort, ignored if not found).
            Write-Host "Appending to RUSTFLAGS: $rustflagsAdd"
            $existing = $env:RUSTFLAGS
            $newFlags = if ($existing) { "$existing $rustflagsAdd" } else { $rustflagsAdd }
            "RUSTFLAGS=$newFlags" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "RUSTFLAGS now: $newFlags"
          } else {
            Write-Warning "All vcpkg triplet attempts failed — SDL2_ttf will remain dynamic if needed"
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build (static, +crt-static) — cargo build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "RUSTFLAGS=$env:RUSTFLAGS"
          Write-Host "Building with: cargo build --release --features static --target x86_64-pc-windows-msvc"
          # Preferred: `static` feature (bundled + static-link) + crt-static.
          # Fallback for diagnostics: if static fails due to TTF, the log will show missing symbols.
          cargo build --release --features static --target x86_64-pc-windows-msvc --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Static build failed — retrying with bundled,static-link explicit features for log clarity"
            cargo build --release --features bundled,static-link --target x86_64-pc-windows-msvc --verbose
            throw "cargo build failed even after explicit features"
          }
          $exe = "target\x86_64-pc-windows-msvc\release\play-crt.exe"
          if (-not (Test-Path $exe)) { throw "Expected exe not found: $exe" }
          Write-Host "Built $exe"
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Verify no SDL2 DLLs required (and check CRT linkage)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $exe = "target\x86_64-pc-windows-msvc\release\play-crt.exe"
          Write-Host "Checking $exe dependencies — should NOT list SDL2.dll / SDL2_ttf.dll for fully static build"
          # dumpbin is available via VS dev tools; try to use it if on PATH
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          if ($dumpbin) {
            & dumpbin /dependents $exe | Tee-Object -Variable deps
            $hasSDL = $deps | Select-String -Pattern "SDL2"
            if ($hasSDL) {
              Write-Warning "Binary still depends on SDL2 DLLs (see above). This is expected if vcpkg TTF static step was skipped — SDL2 core is static but TTF remains dynamic."
              Write-Warning "If fully static TTF was intended, check vcpkg step logs for missing freetype/harfbuzz static libs."
            } else {
              Write-Host "No SDL2.dll dependency detected — static link verified."
            }
          } else {
            Write-Host "dumpbin not on PATH, skipping dependents check. Verifying no DLLs next to exe."
            $dir = Split-Path $exe
            $dlls = Get-ChildItem $dir -Filter "SDL*.dll" -ErrorAction SilentlyContinue
            if ($dlls) { Write-Warning "Found SDL DLLs next to exe: $($dlls.Name)" } else { Write-Host "No SDL DLLs next to exe — good." }
          }
          # Bring assets next to exe for manual smoke test (not required for artifact)
          $distDir = "dist-static"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item $exe -Destination (Join-Path $distDir "play-crt.exe") -Force
          # Bundle fonts/shaders/README if they exist at runtime
          foreach ($p in @("assets", "README.md", "LICENSE")) {
            if (Test-Path $p) { Copy-Item $p -Destination $distDir -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "Staged dist-static dir:"
          Get-ChildItem $distDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package static artifact (zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "target\x86_64-pc-windows-msvc\release\play-crt.exe"
          $zipName = "play-crt-x86_64-pc-windows-msvc-static.zip"
          $staging = "staging-static"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe -Destination (Join-Path $staging "play-crt.exe") -Force
          # Include assets that play-crt expects at runtime if present
          foreach ($p in @("assets")) {
            if (Test-Path $p) { Copy-Item $p -Destination (Join-Path $staging $p) -Recurse -Force }
          }
          foreach ($f in @("README.md", "LICENSE")) {
            if (Test-Path $f) { Copy-Item $f -Destination $staging -Force }
          }
          # Create zip at repo root
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          Get-Item $zipName | Format-List Name, Length
          # Also keep the bare exe as artifact for convenience
          Copy-Item $exe -Destination "play-crt-static.exe" -Force

      - name: Upload static artifact (zip + exe)
        uses: actions/upload-artifact@v7
        with:
          name: play-crt-windows-static
          if-no-files-found: error
          path: |
            play-crt-x86_64-pc-windows-msvc-static.zip
            play-crt-static.exe

      # Optional: publish to GitHub Release on tags (mirrors cargo-dist `host` step).
      # Runs only on tag pushes; PRs just upload as workflow artifact above.
      - name: Publish static zip to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $zip = "play-crt-x86_64-pc-windows-msvc-static.zip"
          if (-not (Test-Path $zip)) { throw "Zip not found: $zip" }
          Write-Host "Uploading $zip to release $tag"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag not yet created by cargo-dist — will be created by release.yml host job. Uploading as workflow artifact only."
            exit 0
          }
          gh release upload $tag $zip --clobber
          Write-Host "Uploaded $zip to $tag"
