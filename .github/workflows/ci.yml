name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: check / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Install SDL2 deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: cargo check
        run: cargo check --locked

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # Optional: ensure cargo-dist plan is valid without building all targets
  dist-plan:
    name: cargo dist plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: "cargo dist plan (verify 5 targets: linux arm, linux x64, darwin arm, darwin x64, windows static)"
        run: |
          ~/.cargo/bin/dist plan --output-format=json > dist-plan.json
          cat dist-plan.json
          jq -e '.ci.github.artifacts_matrix' dist-plan.json >/dev/null || (echo "dist plan missing artifacts_matrix"; exit 1)
          echo "Verifying 5 targets (aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc)..."
          jq -e '.ci.github.artifacts_matrix.include | length == 5' dist-plan.json >/dev/null || (echo "expected 5 artifacts_matrix entries, got $(jq '.ci.github.artifacts_matrix.include | length' dist-plan.json)"; exit 1)
          jq -e '.ci.github.artifacts_matrix.include[] | select(.targets[] == "aarch64-unknown-linux-gnu")' dist-plan.json >/dev/null || (echo "missing aarch64-unknown-linux-gnu target"; exit 1)
          jq -e '.ci.github.artifacts_matrix.include[] | select(.targets[] == "x86_64-unknown-linux-gnu")' dist-plan.json >/dev/null || (echo "missing x86_64-unknown-linux-gnu target"; exit 1)
          jq -e '.ci.github.artifacts_matrix.include[] | select(.targets[] == "aarch64-apple-darwin")' dist-plan.json >/dev/null || (echo "missing aarch64-apple-darwin target"; exit 1)
          jq -e '.ci.github.artifacts_matrix.include[] | select(.targets[] == "x86_64-apple-darwin")' dist-plan.json >/dev/null || (echo "missing x86_64-apple-darwin target"; exit 1)
          jq -e '.ci.github.artifacts_matrix.include[] | select(.targets[] == "x86_64-pc-windows-msvc")' dist-plan.json >/dev/null || (echo "missing x86_64-pc-windows-msvc target"; exit 1)
          echo "All 5 targets present"

  # Full cargo-dist build verification on push to main (and PRs).
  # Mirrors release.yml's 5-target matrix but without publish — verifies
  # actual compilation/linking via `cargo dist build --artifacts=local`.
  # Trigger is push to main/master + pull_request (no tags). To limit
  # expensive cross builds to main only, uncomment the `if:` below.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Uncomment to run heavy builds only on push to main (saves PR minutes):
    # if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh

      - name: Install dependencies (Linux)
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Install cross toolchain for aarch64 Linux (if needed)
        if: contains(matrix.target, 'aarch64-unknown-linux-gnu') && startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross || true

      - name: Ensure Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install SDL2 dependencies (macOS)
        if: contains(matrix.runner, 'macos')
        run: brew install sdl2 sdl2_ttf || brew upgrade sdl2 sdl2_ttf || true

      - name: Ensure cmake for Windows bundled build
        if: matrix.runner == 'windows-2022'
        shell: pwsh
        run: cmake --version || choco install cmake --yes

      # Windows static single-exe: bundled+static-link (mirrors release.yml).
      # SDL2_ttf static deps via vcpkg x64-windows-static + CRT static.
      - name: Install SDL2 / SDL2_ttf static libs via vcpkg (x64-windows-static)
        if: matrix.runner == 'windows-2022'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          Write-Host "VCPKG root: $vcpkgRoot"
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) { throw "vcpkg.exe not found at $vcpkg — required for static SDL2_ttf" }
          & $vcpkg version
          $triplets = @("x64-windows-static", "x64-windows-static-md")
          $installedTriplet = $null
          foreach ($tri in $triplets) {
            Write-Host "`n=== Trying vcpkg install sdl2 sdl2-ttf freetype harfbuzz:$tri ==="
            & $vcpkg install sdl2:$tri sdl2-ttf:$tri freetype:$tri harfbuzz:$tri --recurse 2>&1 | Tee-Object -Variable out
            if ($LASTEXITCODE -eq 0) {
              Write-Host "vcpkg install succeeded with triplet $tri"
              $installedTriplet = $tri
              break
            } else {
              Write-Warning "vcpkg install failed for $tri, trying next"
            }
          }
          if (-not $installedTriplet) { throw "All vcpkg triplet attempts failed — cannot build static Windows exe" }
          Write-Host "Installing auxiliary static deps for $installedTriplet (best-effort)"
          & $vcpkg install libpng:$installedTriplet zlib:$installedTriplet bzip2:$installedTriplet brotli:$installedTriplet graphite2:$installedTriplet 2>&1 | Out-Null
          $installed = Join-Path $vcpkgRoot "installed\$installedTriplet"
          $libDir = Join-Path $installed "lib"
          Write-Host "vcpkg installed dir: $installed"
          Write-Host "libDir: $libDir"
          if (Test-Path $libDir) { Get-ChildItem $libDir -Filter "*.lib" | Select-Object Name, Length | Format-Table -AutoSize }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=$installedTriplet" | Out-File -FilePath $env:GITHUB_ENV -Append
          function Get-LibName($dir, $candidates) { foreach($c in $candidates) { if(Test-Path "$dir\$c.lib") { return $c } } return $null }
          $libCandidates = @(
            @("SDL2_ttf"),
            @("freetype"),
            @("harfbuzz"),
            @("graphite2"),
            @("libpng16","libpng","png16","png"),
            @("zlib","z","zs"),
            @("bz2","bzip2"),
            @("brotlicommon"),
            @("brotlidec")
          )
          $extraLibs = @()
          foreach($cands in $libCandidates) {
            $name = Get-LibName $libDir $cands
            if($name) { $extraLibs += $name; Write-Host "Found lib: $name.lib for candidates $($cands -join ',')" } else { Write-Warning "lib not found for candidates $($cands -join ',') in $libDir — skipping" }
          }
          if($extraLibs.Count -eq 0) {
            $rustflagsAdd = "-C target-feature=+crt-static -L $libDir"
          } else {
            $libFlags = ($extraLibs | ForEach-Object { "-l static=$_" }) -join " "
            $rustflagsAdd = "-C target-feature=+crt-static -L $libDir $libFlags"
          }
          Write-Host "Appending to RUSTFLAGS: $rustflagsAdd"
          $existing = $env:RUSTFLAGS
          $newFlags = if ($existing) { "$existing $rustflagsAdd" } else { $rustflagsAdd }
          "RUSTFLAGS=$newFlags" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RUSTFLAGS now: $newFlags"
          Write-Host "Static Windows libs ready — no DLLs (single exe)"

      - name: cargo dist build (--artifacts=local)
        shell: bash
        run: |
          set -e
          echo "Building target ${{ matrix.target }} via cargo-dist..."
          if ~/.cargo/bin/dist build --artifacts=local --target ${{ matrix.target }} --output-format=json > dist-manifest.json 2>&1; then
            echo "cargo dist build succeeded"
            cat dist-manifest.json
          else
            echo "cargo dist build failed or not available, falling back to cargo build --profile dist"
            cat dist-manifest.json || true
            cargo build --profile dist --target ${{ matrix.target }} --verbose
          fi
          echo "Build step complete for ${{ matrix.target }}"
