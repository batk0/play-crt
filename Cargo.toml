[package]
name = "zork-crt-gui"
version = "0.1.0"
edition = "2021"
description = "Portable CRT GUI for Z-machine games (Zork I and others) — SDL2 + phosphor CRT shader"
license = "MIT"
repository = "https://github.com/akayukov/zork-crt-gui"
keywords = ["zork", "z-machine", "crt", "sdl2", "retro"]
readme = "README.md"

[dependencies]
sdl2 = { version = "0.38", features = ["ttf"] }
rfd = "0.15"
glow = "0.16"
zip = "2"

# Pure-Rust Z-machine (vendored encrusted, MIT). Replaces dfrotz subprocess.
# `zork-rs` does not exist on crates.io as of 2026-08 — encrusted is the
# closest MIT pure-Rust Z-machine (supports .z3/.z5/.z8, 80×24).
base64 = "0.10"
rand = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = 3
strip = true
