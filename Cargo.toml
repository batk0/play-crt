[package]
name = "play-crt"
version = "0.1.11"
edition = "2021"
description = "PLAY-CRT — Z-machine + 95 BASIC games in a phosphor CRT (SDL2, 80x24 VT323, crt-lottes PUBLIC DOMAIN shader, bottom switches)"
license = "MIT"
repository = "https://github.com/batk0/play-crt"
homepage = "https://github.com/batk0/play-crt"
documentation = "https://github.com/batk0/play-crt#readme"
readme = "README.md"
keywords = ["z-machine", "zork", "crt", "sdl2", "retro", "basic"]
categories = ["games", "emulators"]
authors = ["batk0"]

[[bin]]
name = "play-crt"
path = "src/main.rs"

[features]
bundled = ["sdl2/bundled"]
# Static MSVC single-exe: SDL2 core via sdl2-sys `bundled` cmake static (SDL_SHARED=OFF/SDL_STATIC=ON)
# + CRT static (+crt-static). SDL2_ttf is NOT handled by sdl2-sys when bundled+static-link
# (see sdl2-sys build.rs: static-link skips SDL2_ttf when bundled). Worked around via vcpkg
# x64-windows-static triplet + RUSTFLAGS `-l static=SDL2_ttf -l static=freetype …` in
# .github/workflows/release.yml (Windows job). `bundled` remains for local dynamic builds;
# `static` = fully static single exe (6.2 MiB, no DLLs).
static = ["sdl2/bundled", "sdl2/static-link"]
default = []

[dependencies]
sdl2 = { version = "0.38", features = ["ttf"] }
glow = "0.16"
zip = "2"

# Pure-Rust Z-machine (vendored encrusted, MIT). Replaces dfrotz subprocess.
# `zork-rs` does not exist on crates.io as of 2026-08 — encrusted is the
# closest MIT pure-Rust Z-machine (supports .z3/.z5/.z8, 80×24).
base64 = "0.10"
rand = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
ureq = "2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
opt-level = 3
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist configuration for GitHub Releases binaries
# https://opensource.axo.dev/cargo-dist/book/reference/config.html
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
tap = "batk0/homebrew-tap"
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
include = ["assets", "README.md", "LICENSE"]
publish-jobs = ["homebrew"]
allow-dirty = ["ci"]
# System dependencies for SDL2 (Linux/macOS need system libs; Windows uses bundled+static via sdl2-sys+cmake+vcpkg)
# aarch64 Linux cross on x86_64 runner needs gcc-aarch64 cross toolchain + libc
[workspace.metadata.dist.dependencies.apt]
libsdl2-dev = "*"
libsdl2-ttf-dev = "*"
pkg-config = "*"
gcc-aarch64-linux-gnu = "*"
"g++-aarch64-linux-gnu" = "*"
libc6-dev-arm64-cross = "*"

[workspace.metadata.dist.dependencies.homebrew]
sdl2 = "*"
sdl2_ttf = "*"

# Windows: bundled+static-link builds SDL2 core statically via cmake (SDL_STATIC=ON);
# SDL2_ttf static deps come from vcpkg x64-windows-static (see release.yml Windows job).
[workspace.metadata.dist.dependencies.chocolatey]
cmake = "*"

# Windows: single static exe (no DLLs) — static = sdl2/bundled + sdl2/static-link (cmake SDL_STATIC=ON,
# CRT +crt-static via RUSTFLAGS). SDL2_ttf static deps via vcpkg x64-windows-static in release.yml.
[workspace.metadata.dist.overrides.x86_64-pc-windows-msvc]
features = ["static"]
