[package]
name = "play-crt"
version = "0.1.7"
edition = "2021"
description = "PLAY-CRT — Z-machine + 95 BASIC games in a phosphor CRT (SDL2, 80x24 VT323, crt-lottes PUBLIC DOMAIN shader, bottom switches)"
license = "MIT"
repository = "https://github.com/batk0/play-crt"
homepage = "https://github.com/batk0/play-crt"
documentation = "https://github.com/batk0/play-crt#readme"
readme = "README.md"
keywords = ["z-machine", "zork", "crt", "sdl2", "retro", "basic"]
categories = ["games", "emulators"]
authors = ["batk0"]

[[bin]]
name = "play-crt"
path = "src/main.rs"

[features]
bundled = ["sdl2/bundled"]
# Static MSVC build: SDL2 core via sdl2-sys `bundled` cmake static (SDL_SHARED=OFF/SDL_STATIC=ON)
# + CRT static (+crt-static). SDL2_ttf is NOT handled by sdl2-sys when bundled+static-link
# (see sdl2-sys build.rs: static-link skips SDL2_ttf when bundled). In
# .github/workflows/windows-static.yml this is worked around via vcpkg
# x64-windows-static triplet + RUSTFLAGS `-l static=SDL2_ttf -l static=freetype …`.
# Keep `bundled` for the dynamic Windows job; `static` = fully static attempt.
static = ["sdl2/bundled", "sdl2/static-link"]
default = []

[dependencies]
sdl2 = { version = "0.38", features = ["ttf"] }
glow = "0.16"
zip = "2"

# Pure-Rust Z-machine (vendored encrusted, MIT). Replaces dfrotz subprocess.
# `zork-rs` does not exist on crates.io as of 2026-08 — encrusted is the
# closest MIT pure-Rust Z-machine (supports .z3/.z5/.z8, 80×24).
base64 = "0.10"
rand = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
ureq = "2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
opt-level = 3
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist configuration for GitHub Releases binaries
# https://opensource.axo.dev/cargo-dist/book/reference/config.html
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
tap = "batk0/homebrew-tap"
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
include = ["assets/fonts/VT323-Regular.ttf", "assets/fonts/OFL.txt", "assets/shaders/crt-lottes.glsl", "assets/shaders/crt-lottes.vert", "assets/shaders/crt-lottes.frag", "assets/shaders/LICENSE", "README.md", "LICENSE"]
publish-jobs = ["homebrew"]
allow-dirty = ["ci"]
# System dependencies for SDL2 (Linux/macOS need system libs; Windows uses bundled via sdl2-sys+cmake)
[workspace.metadata.dist.dependencies.apt]
libsdl2-dev = "*"
libsdl2-ttf-dev = "*"
pkg-config = "*"

[workspace.metadata.dist.dependencies.homebrew]
sdl2 = "*"
sdl2_ttf = "*"

# Windows: sdl2-sys `bundled` builds SDL2 core from source (needs cmake, preinstalled
# on windows-2022) but `sdl2` with `features = ["ttf"]` still needs external libs
# at MSVC link time. v0.1.4 failed with LINK LNK1181 cannot open SDL2.lib because
# only SDL2_ttf was vendored. release.yml now downloads BOTH SDL2-devel-2.30.8-VC.zip
# and SDL2_ttf-devel-2.22.0-VC.zip to D:\a\_temp\ (RUNNER_TEMP) and sets LIB/RUSTFLAGS
# to both lib\x64 dirs + stages both DLLs. Keep cmake/bundled; external libs satisfy
# linking regardless of bundled static build.
[workspace.metadata.dist.dependencies.chocolatey]
cmake = "*"

# Windows builds use bundled SDL2 core; external SDL2+SDL2_ttf libs are provided in CI as fallback for linking
[workspace.metadata.dist.overrides.x86_64-pc-windows-msvc]
features = ["bundled"]
