[package]
name = "play-crt"
version = "0.1.0"
edition = "2021"
description = "PLAY-CRT — Z-machine + 95 BASIC games in a phosphor CRT (SDL2, 80x24 VT323, crt-pi shader, bottom switches)"
license = "MIT"
repository = "https://github.com/batk0/play-crt"
keywords = ["z-machine", "zork", "crt", "sdl2", "retro", "basic"]
readme = "README.md"

[dependencies]
sdl2 = { version = "0.38", features = ["ttf"] }
glow = "0.16"
zip = "2"

# Pure-Rust Z-machine (vendored encrusted, MIT). Replaces dfrotz subprocess.
# `zork-rs` does not exist on crates.io as of 2026-08 — encrusted is the
# closest MIT pure-Rust Z-machine (supports .z3/.z5/.z8, 80×24).
base64 = "0.10"
rand = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
ureq = "2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
opt-level = 3
strip = true
